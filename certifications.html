  :root{
    --blue:#bb8500;

    --bg:#f5f5f5;
    --card:#ffffff;
    --border:#e5e5e5;
    --text:#111111;
    --muted:#6c757d;
    --faint:#8a8f98;
    --hover:#f0f0f0;
    --header-bg:#000000;
    --header-text:#ffffff;
    --preview-bg:#fafafa;
    --chip:#f0f0f0;
    --hicchip:#cccccc;
    --active-bg:#fff8e6;
    --active-count:#ffbd39;
    --btn-hover:#fff3d6;
  }
  [data-theme="dark"]{
    --blue:#ffbd39;
    --blue-dark:#e6a817;
    --bg:#0a0a0a;
    --card:#161616;
    --border:#2a2a2a;
    --text:#ffffff;
    --muted:#999999;
    --faint:#8a94a6;
    --hover:#1f1f1f;
    --header-bg:#000000;
    --header-text:#ffffff;
    --preview-bg:#121212;
    --chip:#222222;
    --hicchip:#3a3a3a;
    --active-bg:#1a1a1a;
    --active-count:#ffbd39;
    --btn-hover:#1f1f1f;
  }
  body{
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    transition:background .3s,color .3s;
  }
  html[data-theme="dark"] .cat .ico,
  html[data-theme="dark"] .cert-issuer-row img{background:#111;}

  /* ===== Top nav (like index.html) ===== */
  .topnav{
    position:sticky;top:0;z-index:50;
    background:var(--header-bg);color:var(--header-text);
    transition:background .3s,color .3s;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }
  .topnav-inner{
    max-width:1300px;margin:0 auto;padding:0 32px;height:60px;
    display:flex;align-items:center;gap:24px;
  }
  .topnav .brand-link{
    color:var(--header-text);text-decoration:none;
    font-size:20px;font-weight:700;letter-spacing:.5px;
    white-space:nowrap;transition:color .2s;
  }
  .topnav .brand-link:hover{color:var(--blue);}
  .nav-links{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .nav-links a{
    color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:600;
    padding:6px 12px;border-radius:8px;transition:all .2s;
  }
  .nav-links a:hover{color:#fff;background:rgba(255,255,255,.06);}
  .nav-links a.active{color:var(--blue);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .count-pill{
    background:#1e293b;border:1px solid #334155;
    color:#cbd5e1;font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:20px;white-space:nowrap;
  }
  .count-pill b{color:#fff;}
  .theme-toggle{
    width:40px;height:40px;border-radius:10px;
    background:#1e293b;border:1px solid #334155;
    color:#e2e8f0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,transform .2s;flex-shrink:0;
  }
  .theme-toggle:hover{background:#334155;transform:rotate(20deg);}
  .theme-toggle svg{width:20px;height:20px;}
  @media(max-width:900px){
    .topnav-inner{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px;}
    .nav-links{margin-left:0;flex-wrap:wrap;}
    .nav-right{margin-left:auto;}
  }
  @media(max-width:560px){
    .nav-links a{padding:5px 9px;font-size:13px;}
    .count-pill{display:none;}
  }

  /* ===== Footer ===== */
  .site-footer{
    background:var(--header-bg);color:#94a3b8;
    padding:28px 32px;text-align:center;font-size:14px;
  }
  .site-footer a{color:var(--blue);text-decoration:none;}
  .site-footer a:hover{text-decoration:underline;}

  /* ===== Layout ===== */
  .layout{
    max-width:1300px;margin:0 auto;padding:24px 32px 60px;
    display:grid;grid-template-columns:280px 1fr;gap:24px;
    align-items:start;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    position:sticky;top:84px;
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:20px;overflow:hidden;
  }
  .sidebar h3{
    font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--faint);font-weight:700;margin-bottom:14px;
  }
  .cat{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:10px;
    cursor:pointer;margin-bottom:2px;
    transition:background .15s;border:none;width:100%;text-align:left;
    background:none;font-family:inherit;color:var(--text);
  }
  .cat:hover{background:var(--hover);}
  .cat.active{background:var(--active-bg);color:var(--blue);}
  .cat .ico{
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    background:#fff;object-fit:contain;border:1px solid var(--border);
    padding:3px;
  }
  .cat .cat-name{flex:1;font-size:14px;font-weight:600;}
  .cat .cat-count{
    font-size:13px;font-weight:800;color:var(--muted);
    background:var(--chip);border-radius:20px;padding:2px 10px;
  }
  .cat.active .cat-count{background:var(--active-count);color:#000;}

  /* ===== Main ===== */
  .main h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  .main .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:20px;}
  .sort-label{font-size:13px;font-weight:600;color:var(--muted);}
  .sort-select{
    font-family:inherit;font-size:13px;font-weight:600;
    color:var(--text);background:var(--card);
    border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;cursor:pointer;outline:none;
  }
  .sort-select:hover{border-color:var(--hicchip);}
  .sort-select option{background:var(--card);color:var(--text);}
  @media(max-width:600px){
    .toolbar{justify-content:flex-start;}
  }
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;
  }

  .cert{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
    transition:transform .15s,box-shadow .15s;
  }
  .cert:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(15,23,42,.08);
  }
  .cert-preview{
    position:relative;height:180px;background:var(--preview-bg);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;border-bottom:1px solid var(--border);
  }
  .cert-preview img.preview{
    width:100%;height:100%;object-fit:cover;
    transition:transform .3s;
  }
  .cert:hover .cert-preview img.preview{transform:scale(1.04);}
  .cert-preview .badge{
    position:absolute;top:10px;right:10px;
    background:rgba(15,23,42,.75);color:#fff;
    font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
    backdrop-filter:blur(4px);
  }
  .cert-preview .open-hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    background:var(--blue);color:#fff;font-size:12px;font-weight:600;
    padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .2s;
    box-shadow:0 4px 10px rgba(255,189,57,.3);
  }
  .cert:hover .open-hint{opacity:1;}

  .cert-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;}
  .cert-issuer-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .cert-issuer-row img{width:30px;height:30px;border-radius:6px;object-fit:contain;border:1px solid var(--border);padding:2px;}
  .cert-issuer-row .issuer{font-size:12px;font-weight:600;color:var(--muted);}
  .cert-title{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:6px;}
  .cert-date{font-size:12px;color:var(--faint);margin-bottom:10px;}
  .cert-footer{margin-top:auto;display:flex;gap:8px;}
  .btn{
    flex:1;text-align:center;text-decoration:none;
    font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;
    border:1px solid var(--blue);color:var(--blue);transition:all .15s;
  }
  .btn:hover{background:var(--btn-hover);}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn.primary:hover{background:var(--blue-dark);color:#fff;}

  /* ===== Modal ===== */
  .modal{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(15,23,42,.7);padding:40px 20px;
    align-items:flex-start;justify-content:center;overflow:auto;
  }
  .modal.open{display:flex;}
  .modal-card{
    background:var(--card);border-radius:16px;max-width:1000px;width:100%;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--border);
  }
  .modal-head .m-title{font-size:16px;font-weight:700;}
  .modal-head .m-sub{font-size:13px;color:var(--muted);}
  .modal-close{
    border:none;background:var(--chip);width:34px;height:34px;border-radius:8px;
    font-size:18px;cursor:pointer;flex-shrink:0;color:var(--muted);
  }
  .modal-close:hover{background:var(--hover);color:var(--text);}
  .modal-body{padding:20px 24px 24px;}
  .modal-body img{
    width:100%;border-radius:10px;border:1px solid var(--border);
  }
  .modal-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .modal-actions .btn{flex:0 0 auto;}

  .empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:60px 0;}

  @media(max-width:820px){
    .layout{grid-template-columns:1fr;padding:16px;}
    .sidebar{position:static;overflow-x:auto;display:flex;flex-wrap:wrap;gap:8px;}
    .sidebar h3{width:100%;}
    .cat{width:auto;}
  }
</style>

let activeCat = 'all';
let sortMode = 'new';

const MONTH_NUM = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

function certDate(c){
  const parts = String(c.date || '').split(' ');
  const m = MONTH_NUM[parts[0]];
  const y = parseInt(parts[1], 10);
  return (isNaN(y) || m === undefined) ? 0 : new Date(y, m, 1).getTime();
}

function sortedList(list){
  const arr = list.slice();
  if(sortMode === 'new') arr.sort((a,b) => certDate(b) - certDate(a));
  else if(sortMode === 'old') arr.sort((a,b) => certDate(a) - certDate(b));
  else if(sortMode === 'nameA') arr.sort((a,b) => a.title.localeCompare(b.title));
  else if(sortMode === 'nameZ') arr.sort((a,b) => b.title.localeCompare(a.title));
  return arr;
}

const catIcons = {};
CATS.forEach(c => catIcons[c.key] = c.icon);

function catName(key){
  const c = CATS.find(x => x.key===key);
  return c ? c.name : key;
}

function renderCats(){
  const holder = document.getElementById('cats');
  holder.innerHTML = '';
  CATS.forEach(c => {
    const count = c.key==='all' ? CERTS.length : CERTS.filter(x => x.cat===c.key).length;
    if(count===0 && c.key!=='all') return;
    const btn = document.createElement('button');
    btn.className = 'cat' + (c.key===activeCat ? ' active':'');
    btn.onclick = () => selectCat(c.key);
    btn.innerHTML = '<img class="ico" src="'+c.icon+'" alt="">' +
      '<span class="cat-name">'+c.name+'</span>' +
      '<span class="cat-count">'+count+'</span>';
    holder.appendChild(btn);
  });
  document.getElementById('totalCount').textContent = CERTS.length;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const all = activeCat==='all' ? CERTS : CERTS.filter(c => c.cat===activeCat);
  const list = sortedList(all);
  document.getElementById('currentCat').textContent =
    activeCat==='all' ? 'All certificates' : catName(activeCat)+' certificates';
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty">No certificates in this category</div>';
    return;
  }
  list.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'cert';
    card.innerHTML =
      '<div class="cert-preview" onclick="openModal('+(CERTS.indexOf(c))+')">' +
        '<img class="preview" src="'+c.img+'" alt="'+c.title+'">' +
        '<span class="badge">'+catName(c.cat)+'</span>' +
        '<span class="open-hint">View certificate</span>' +
      '</div>' +
      '<div class="cert-body">' +
        '<div class="cert-issuer-row">' +
          '<img src="'+catIcons[c.cat]+'" alt="">' +
          '<span class="issuer">'+c.issuer+'</span>' +
        '</div>' +
        '<div class="cert-title">'+c.title+'</div>' +
        '<div class="cert-date">Issued '+c.date+'</div>' +
        '<div class="cert-footer">' +
          '<a class="btn" href="'+c.file+'" target="_blank">View</a>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });
}

function selectCat(key){
  activeCat = key;
  renderCats();
  renderGrid();
}

document.getElementById('sortSel').addEventListener('change', function(){
  sortMode = this.value;
  renderGrid();
});

function openModal(idx){
  const c = CERTS[idx];
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mSub').textContent = c.issuer + ' · Issued ' + c.date;
  document.getElementById('mImg').src = c.img;
  document.getElementById('mOpen').href = c.file;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const dark = theme === 'dark';
  document.getElementById('iconMoon').style.display = dark ? 'none' : 'block';
  document.getElementById('iconSun').style.display = dark ? 'block' : 'none';
  try{ localStorage.setItem('site-theme', theme); }catch(e){}
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
let saved = 'light';
try{ saved = localStorage.getItem('site-theme') || 'light'; }catch(e){}
applyTheme(saved);

renderCats();
renderGrid();
</script>
